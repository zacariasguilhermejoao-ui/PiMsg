name: Android signed APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and install required packages
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's Ubuntu runner image already provides Android command-line tools.
          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$ANDROID_HOME/cmdline-tools"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "Using SDK manager at: $SDKMANAGER"
          # Accept licenses only on this ephemeral GitHub Actions runner.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail
          # Each quoted SDK package ID is a separate sdkmanager argument.
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          echo "Android SDK packages installed and verified."

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify Gradle installation
        run: |
          set -euo pipefail
          gradle --version

      - name: Prepare Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing repository secret GOOGLE_SERVICES_JSON."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          test -s android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("android/app/google-services.json").read_text())
          clients = config.get("client", [])
          expected = "com.pimsg.isabstudio"
          app_client = next((
              client for client in clients
              if client.get("client_info", {}).get("android_client_info", {}).get("package_name") == expected
          ), None)
          if app_client is None:
              raise SystemExit("google-services.json has no Android client for com.pimsg.isabstudio")
          oauth_clients = app_client.get("oauth_client", [])
          has_web_client = any(str(client.get("client_type")) == "3" for client in oauth_clients)
          if has_web_client:
              print("Firebase JSON contains the PiMsg Android client and a Web OAuth client.")
          else:
              print("::warning::Firebase JSON has no Web OAuth client (client_type 3). Google sign-in needs a Web OAuth client in Firebase and an updated GOOGLE_SERVICES_JSON secret.")
          PY

      - name: Prepare Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = "".join(os.environ["ANDROID_KEYSTORE_BASE64"].split())
          try:
              decoded = base64.b64decode(
                  encoded + "=" * (-len(encoded) % 4),
                  altchars=b"-_",
                  validate=True,
              )
          except Exception:
              raise SystemExit(
                  "ANDROID_KEYSTORE_BASE64 is invalid. Re-encode the original .jks as "
                  "single-line Base64 and update this GitHub Actions secret."
              )
          if not decoded:
              raise SystemExit("ANDROID_KEYSTORE_BASE64 decoded to an empty keystore.")
          Path("android/app/pimsg-release.jks").write_bytes(decoded)
          PY
          test -s android/app/pimsg-release.jks
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/pimsg-release.jks" >> "$GITHUB_ENV"
          echo "Keystore decoded. Its password and alias will be checked next."

      - name: Preflight release compilation, resources and R8
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # The Gradle build script configures release signing eagerly; supply the
          # secrets here, but do not invoke signing tasks in this preflight.
          gradle -p android --no-daemon \
            :app:compileReleaseKotlin \
            :app:processReleaseResources \
            :app:minifyReleaseWithR8

      - name: Validate keystore and print certificate SHA fingerprints
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_LIST="$RUNNER_TEMP/keystore-list.txt"
          KEYSTORE_ERROR="$RUNNER_TEMP/keystore-error.txt"

          # Keep keytool diagnostics visible without ever printing secret values.
          if ! keytool -list -v \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            > "$KEYSTORE_LIST" 2> "$KEYSTORE_ERROR"; then
            echo "::error::Could not open the decoded keystore. Check whether ANDROID_KEYSTORE_BASE64 is the correct original .jks/.keystore and whether ANDROID_KEYSTORE_PASSWORD matches it."
            if [ -s "$KEYSTORE_ERROR" ]; then
              cat "$KEYSTORE_ERROR"
            else
              echo "keytool returned an error without diagnostic text."
            fi
            exit 1
          fi

          if ! grep -Fqx -- "Alias name: $ANDROID_KEY_ALIAS" "$KEYSTORE_LIST"; then
            echo "::error::The keystore opened successfully, but ANDROID_KEY_ALIAS does not match an entry in it."
            echo "Aliases actually found in the keystore:"
            grep '^Alias name: ' "$KEYSTORE_LIST" || true
            exit 1
          fi

          echo "Keystore password and alias validated."
          awk -v alias="$ANDROID_KEY_ALIAS" '
            /^Alias name: / { selected = ($0 == "Alias name: " alias) }
            selected && (/^SHA1: / || /^SHA256: /) { print }
          ' "$KEYSTORE_LIST"
          echo "The private-key password will be tested during release signing."

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android --no-daemon clean assembleRelease bundleRelease

      - name: Verify signed APK and AAB
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          apksigner verify --verbose --print-certs "$APK"
          jarsigner -verify -verbose "$AAB"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PiMsg-release-signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: PiMsg-release-signed-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
