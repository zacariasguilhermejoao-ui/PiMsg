name: Android signing certificate fingerprints

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprints:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode release keystore and print SHA fingerprints
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          encoded = "".join(os.environ["ANDROID_KEYSTORE_BASE64"].split())
          data = base64.b64decode(encoded + "=" * (-len(encoded) % 4), altchars=b"-_", validate=True)
          if not data:
              raise SystemExit("Keystore is empty.")
          Path("${{ runner.temp }}/pimsg-release.jks").write_bytes(data)
          PY
          KEYSTORE="$RUNNER_TEMP/pimsg-release.jks"
          keytool -list -v -keystore "$KEYSTORE" -storepass:env ANDROID_KEYSTORE_PASSWORD > "$RUNNER_TEMP/cert.txt"
          if ! grep -Fqx -- "Alias name: $ANDROID_KEY_ALIAS" "$RUNNER_TEMP/cert.txt"; then
            echo "::error::Configured alias was not found in the release keystore."
            grep '^Alias name: ' "$RUNNER_TEMP/cert.txt" || true
            exit 1
          fi
          echo "Meta Facebook Android Key Hash:"
          keytool -exportcert -alias "$ANDROID_KEY_ALIAS" -keystore "$KEYSTORE" -storepass:env ANDROID_KEYSTORE_PASSWORD \
            | openssl sha1 -binary | openssl base64
          echo "Certificate fingerprints:"
          awk -v alias="$ANDROID_KEY_ALIAS" '
            /^Alias name: / { selected = ($0 == "Alias name: " alias) }
            selected && (/^SHA1: / || /^SHA256: /) { print }
          ' "$RUNNER_TEMP/cert.txt"
