<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="120" height="120" fill="none">
  <style>
    @keyframes botFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes botBlink {
      0%, 44%, 50%, 100% { transform: scaleY(1); }
      47% { transform: scaleY(0.12); }
    }
    @keyframes antennaPulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    .bot-body {
      animation: botFloat 2.4s ease-in-out infinite;
      transform-origin: 100px 105px;
    }
    .bot-eye-left {
      animation: botBlink 3.6s ease-in-out infinite;
      transform-origin: 80px 104px;
    }
    .bot-eye-right {
      animation: botBlink 3.6s ease-in-out infinite;
      transform-origin: 120px 104px;
    }
    .antenna-tip {
      animation: antennaPulse 1.8s ease-in-out infinite;
    }
  </style>

  <defs>
    <linearGradient id="headGrad" x1="100" y1="50" x2="100" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#56B4E9" />
      <stop offset="100%" stop-color="#3582B8" />
    </linearGradient>

    <linearGradient id="visorGrad" x1="100" y1="68" x2="100" y2="142" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#296B9C" />
      <stop offset="100%" stop-color="#1D517A" />
    </linearGradient>

    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g class="bot-body">
    <path d="M74 148 C74 167, 126 167, 126 148 Z" fill="#4393C8" />
    <rect x="35" y="88" width="16" height="36" rx="8" fill="#327EB3" />
    <rect x="149" y="88" width="16" height="36" rx="8" fill="#327EB3" />

    <path d="M74 63 Q68 50 61 44" stroke="#3F8FC4" stroke-width="5.5" stroke-linecap="round" />
    <circle cx="58" cy="41" r="8" fill="#46B8E8" class="antenna-tip" />
    <circle cx="58" cy="41" r="4.5" fill="#9CF6FF" filter="url(#cyanGlow)" />

    <path d="M126 63 Q132 50 139 44" stroke="#3F8FC4" stroke-width="5.5" stroke-linecap="round" />
    <circle cx="142" cy="41" r="8" fill="#46B8E8" class="antenna-tip" />
    <circle cx="142" cy="41" r="4.5" fill="#9CF6FF" filter="url(#cyanGlow)" />

    <rect x="46" y="56" width="108" height="98" rx="49" fill="url(#headGrad)" />
    <path d="M78 64 Q100 59 122 64" stroke="#8AD4F8" stroke-width="3.5" stroke-linecap="round" opacity="0.7" />
    <rect x="57" y="68" width="86" height="74" rx="37" fill="url(#visorGrad)" />

    <rect class="bot-eye-left" x="71" y="96" width="18" height="15" rx="7.5" fill="#7CF3FF" filter="url(#cyanGlow)" />
    <rect class="bot-eye-right" x="111" y="96" width="18" height="15" rx="7.5" fill="#7CF3FF" filter="url(#cyanGlow)" />
    <path d="M90 120 Q100 129 110 120" stroke="#7CF3FF" stroke-width="4" stroke-linecap="round" filter="url(#cyanGlow)" />
  </g>
</svg>