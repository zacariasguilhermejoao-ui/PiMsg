<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Gradiente da cabeça -->
    <linearGradient id="headGrad" x1="128" y1="74" x2="128" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22B8FF" />
      <stop offset="100%" stop-color="#0E8CE0" />
    </linearGradient>

    <!-- Gradiente do visor escuro -->
    <linearGradient id="visorGrad" x1="128" y1="88" x2="128" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1371BA" />
      <stop offset="100%" stop-color="#0C5694" />
    </linearGradient>

    <!-- Gradiente do pescoço/base -->
    <linearGradient id="neckGrad" x1="128" y1="196" x2="128" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#137EC8" />
      <stop offset="35%" stop-color="#1EA4F2" />
      <stop offset="100%" stop-color="#138BE0" />
    </linearGradient>

    <!-- Brilho dos olhos e sorriso -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Pescoço / Base inferior -->
  <path d="M88 194 C88 242, 168 242, 168 194 Z" fill="url(#neckGrad)" />

  <!-- Orelhas / Fones laterais -->
  <path d="M56 114 C36 114, 36 168, 56 168 Z" fill="#0B72C4" />
  <path d="M200 114 C220 114, 220 168, 200 168 Z" fill="#0B72C4" />

  <!-- Haste Antena Esquerda -->
  <path d="M84 94 Q76 72 64 58" stroke="#0C6EBC" stroke-width="11" stroke-linecap="round" />
  <!-- Ponta Antena Esquerda -->
  <circle cx="62" cy="54" r="13.5" fill="#18B2FF" />
  <circle cx="62" cy="54" r="7.5" fill="#9CF8FF" />

  <!-- Haste Antena Direita -->
  <path d="M172 94 Q180 72 192 58" stroke="#0C6EBC" stroke-width="11" stroke-linecap="round" />
  <!-- Ponta Antena Direita -->
  <circle cx="194" cy="54" r="13.5" fill="#18B2FF" />
  <circle cx="194" cy="54" r="7.5" fill="#9CF8FF" />

  <!-- Cabeça Principal -->
  <ellipse cx="128" cy="142" rx="76" ry="66" fill="url(#headGrad)" />

  <!-- Reflexo superior na testa -->
  <path d="M100 86 Q128 80 156 86" stroke="#8CE4FF" stroke-width="7" stroke-linecap="round" opacity="0.85" />

  <!-- Borda clara ao redor do visor -->
  <ellipse cx="128" cy="142" rx="63" ry="53" fill="#7CE0FF" opacity="0.65" />

  <!-- Visor Interno -->
  <ellipse cx="128" cy="142" rx="59" ry="49" fill="url(#visorGrad)" />

  <!-- Olho Esquerdo (formato meia-lua sorridente) -->
  <path d="M89 144 C89 124, 113 124, 113 144 C113 148, 108 147, 101 147 C94 147, 89 148, 89 144 Z" fill="#8CF9FF" filter="url(#cyanGlow)" />

  <!-- Olho Direito (formato meia-lua sorridente) -->
  <path d="M143 144 C143 124, 167 124, 167 144 C167 148, 162 147, 155 147 C148 147, 143 148, 143 144 Z" fill="#8CF9FF" filter="url(#cyanGlow)" />

  <!-- Sorriso -->
  <path d="M115 162 Q128 172 141 162" stroke="#8CF9FF" stroke-width="5.5" stroke-linecap="round" filter="url(#cyanGlow)" />
</svg>
